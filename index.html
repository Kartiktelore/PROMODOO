<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">

    
    <div class="todo panel">
      <h3>📝 To-Do List</h3>
      <div class="todo-input-row">
        <input type="text" id="taskInput" placeholder="Enter task..." onkeydown="if(event.key==='Enter') addTask()">
        <button onclick="addTask()">Add</button>
      </div>
      <ul id="taskList"></ul>
    </div>


    <div class="container">
      <h1 class="header" id="header">POMODORO</h1>

      <div class="mode-buttons">
        <button class="mode-btn active" id="btn-work" onclick="setMode('work')">Work · 25m</button>
        <button class="mode-btn" id="btn-short" onclick="setMode('short')">Short Break · 5m</button>
        <button class="mode-btn" id="btn-long" onclick="setMode('long')">Long Break · 15m</button>
      </div>

      <div class="ring-wrap">
        <svg width="240" height="240" viewBox="0 0 240 240">
          <circle cx="120" cy="120" r="104" fill="none" stroke="#2a2a2a" stroke-width="10"/>
          <circle id="progress-ring" cx="120" cy="120" r="104" fill="none"
            stroke="#E24B4A" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="653.45" stroke-dashoffset="0"
            transform="rotate(-90 120 120)"/>
        </svg>
        <div class="ring-center">
          <div class="timer-display" id="timer-display">25:00</div>
          <div class="mode-label" id="mode-label">Focus Time</div>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" onclick="resetTimer()">Reset</button>
        <button class="ctrl-btn primary" id="start-pause-btn" onclick="toggleTimer()">Start</button>
      </div>

      <div class="sessions">
        <p>Sessions Completed: <strong id="session-count">0</strong></p>
      </div>

      <div class="toast" id="toast"></div>
    </div>

    
    <div class="history panel">
      <h3>📋 Session History</h3>
      <ul id="historyList"></ul>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
