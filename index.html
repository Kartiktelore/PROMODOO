<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
     <div class="container">
    <h1 class="Header">POMODORO TECHNIQUE</h1>
    <br>

    <div class="container-apple">
      <div id="timer">25:00</div>  
    <img src="image.png" class="apple">
    <div class="control">
         
        <div class="buttons">
      <button onclick="startTimer()" class="btn btn-warning">Start</button>
      <button onclick="pauseTimer()" class="btn btn-warning">Pause</button>
      <button onclick="resetTimer()" class="btn btn-warning">Reset</button>
    </div>
    
    <div class="mode">
      <button onclick="setWork()" class="btn btn-warning">Work</button>
      <button onclick="setBreak()" class="btn btn-warning">Break</button>
    </div>

    <p class="session">Sessions Completed: <span id="sessions">0</span></p>
    </div>
    
  </div>
    </div>
    

  <script src="index.js"></script>
</body>
</html>
